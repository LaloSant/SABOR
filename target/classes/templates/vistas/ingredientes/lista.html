<!DOCTYPE html>
<html lang="es">

<head th:replace="~{template :: head}"></head>

<body class="bg-body-secondary">
	<header th:replace="~{template :: header (${nomUser}, ${rol})}"></header>
	<div class="container-fluid p-2">
		<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 m-2 p-2">
			<div>
				<h1 class="mb-2 mb-md-0"><u>Lista completa de ingredientes</u></h1>
			</div>
			<div class="d-flex flex-column flex-sm-row gap-2 w-100 w-md-auto">
				<a class="btn btn-success flex-shrink-0" th:href="@{/patrocinadores}">Recetas con patrocinadores</a>
				<form class="d-flex flex-column flex-sm-row gap-2 w-100" onsubmit="return buscarIngrediente();">
					<input id="busqueda" class="form-control" type="search" placeholder="Buscar ingrediente"
						aria-label="Buscar">
					<button class="btn btn-outline-success flex-shrink-0" type="submit">Buscar</button>
				</form>
			</div>
		</div>
		<div class="container-fluid border border-3 border-dark rounded p-0" style="min-height: 30em; overflow-x: auto;">
			<div class="table-responsive">
				<table class="table table-success table-striped rounded text-center table-sm">
				<thead>
					<tr>
						<th scope="col">
							<h2>#</h2>
						</th>
						<th scope="col">
							<h2>NOMBRE</h2>
						</th>
						<th scope="col">
							<h2>PATROCINADOR</h2>
						</th>
						<th scope="col">
							<h2>ACCION</h2>
						</th>
					</tr>
				</thead>
				<tbody class="fs-5">
					<tr th:each="ing : ${ingredientes}">
						<td th:text="${ing.getIdIngrediente()}"></td>
						<td th:text="${ing.nombre}"></td>
						<td th:text="${ing.patrocinador == null? 'Sin Patrocinador' : ing.patrocinador.nombre}"></td>
						<td>
							<a th:href="@{/ingredientes/id(idIngrediente=${ing.idIngrediente})}"
								class="btn btn-success w-100">
								<i class="bi bi-eye-fill"></i> Ver
							</a>
						</td>
					</tr>
				</tbody>
				</table>
			</div>
		</div>
	</div>
	<footer th:replace="~{template :: footer}"></footer>
</body>

<script>
	function buscarIngrediente() {
		const busqueda = document.getElementById('busqueda').value.toLowerCase();
		const filas = document.querySelectorAll('tbody tr');
		filas.forEach(fila => {
			const nombre = fila.querySelector('td:nth-child(2)').textContent.toLowerCase();
			if (nombre.includes(busqueda)) {
				fila.style.display = '';
			} else {
				fila.style.display = 'none';
			}
		});
		return false;
	}
</script>

</html>
